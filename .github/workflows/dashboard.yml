name: Atualizar Dashboard Ana
on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 Brasília
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dashboard-ana-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install pandas requests openpyxl
      - name: Rodar gerador
        run: python dashboard.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Atualizar timestamp no index.html para triggar GitHub Pages build
          sed -i "s/<!-- updated: .* -->/<!-- updated: $(date +'%Y-%m-%d %H:%M') -->/" index.html
          git add data.json imgs/ index.html
          git diff --staged --quiet && exit 0
          git commit -m "Dashboard atualizado $(date +'%d/%m/%Y %H:%M')"
          # Sincronizar com remoto antes de subir, para evitar conflito
          # de execuções concorrentes (múltiplos horários de cron)
          git pull --rebase --autostash origin main
          git push
